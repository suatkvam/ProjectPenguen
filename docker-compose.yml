version: "3.9"

services:
  backend:
    build: ./backend
    container_name: zemin360-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: zemin360-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    container_name: zemin360-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: zemin360
      POSTGRES_PASSWORD: zemin360
      POSTGRES_DB: zemin360
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
